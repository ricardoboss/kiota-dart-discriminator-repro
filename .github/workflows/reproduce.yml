name: reproduce
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kiota: ["1.35.0", "1.36.0", "1.36.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"
      # Exit 0 only when analyzer errors equal expected/<kiota>.txt;
      # exit 1 = unexpected analyzer output, exit 2 = setup failure.
      - run: scripts/reproduce.sh ${{ matrix.kiota }}
